    <main>
        <div class="top-img reservation-img">
            <h2 class="top-title">Reservation</h2>
            <svg class="top-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0,50 C300,120 500,10 800,55
                 S1200,110 1440,35 L1440,120 L0,120 Z" fill="#F6F1E7" />
            </svg>
        </div>
        <section class="reservation">
            <p>下記フォームよりご予約いただけます。</p>
                <p>お電話でのご予約・お問い合わせも承っております。</p>
            <form class="reservation-form" action="#" method="post">

                <div class="form-item">
                    <label for="date">
                        ご予約日
                        <span class="required">必須</span>
                    </label>

                    <select id="date" name="date" required>
                        <option value="">選択してください</option>
                        <option value="2026-10-05">10月5日（月）</option>
                        <option value="2026-10-06">10月6日（火）</option>
                        <option value="2026-10-08">10月8日（木）</option>
                        <option value="2026-10-09">10月9日（金）</option>
                        <option value="2026-10-10">10月10日（土）</option>
                        <option value="2026-10-11">10月11日（日）</option>
                        <option value="2026-10-12">10月12日（月）</option>
                        <option value="2026-10-13">10月13日（火）</option>
                        <option value="2026-10-15">10月15日（木）</option>
                        <option value="2026-10-16">10月16日（金）</option>
                        <option value="2026-10-17">10月17日（土）</option>
                        <option value="2026-10-18">10月18日（日）</option>
                    </select>
                </div>

                <div class="form-item">
                    <label for="time">
                        ご予約時間
                        <span class="required">必須</span>
                    </label>

                    <select id="time" name="time" required>
                        <option value="">選択してください</option>
                        <option value="9:00">9:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="12:00">12:00</option>
                        <option value="13:00">13:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                    </select>
                </div>

                <div class="form-item">
                    <label for="number">
                        ご利用人数
                        <span class="required">必須</span>
                    </label>

                    <select id="number" name="number" required>
                        <option value="">選択してください</option>
                        <option value="1">1名</option>
                        <option value="2">2名</option>
                        <option value="3">3名</option>
                        <option value="4">4名</option>
                        <option value="5">5名</option>
                        <option value="6">6名</option>
                    </select>
                </div>

                <div class="form-item">
                    <label for="name">
                        お名前
                        <span class="required">必須</span>
                    </label>

                    <input type="text" id="name" name="name" placeholder="例）山田 花子" required>
                </div>

                <div class="form-item">
                    <label for="tel">
                        電話番号
                        <span class="required">必須</span>
                    </label>

                    <input type="tel" id="tel" name="tel" placeholder="例）090-1234-5678" required>
                </div>

                <div class="form-item">
                    <label for="message">
                        メッセージ
                        <span class="optional">任意</span>
                    </label>

                    <textarea id="message" name="message" placeholder="ご要望などございましたらご記入ください"></textarea>
                </div>

                <div class="btn">
                    <button type="submit">送信する</button>
                </div>

            </form>
        </section>


        <div class="line thick">
            <div class="line thin">
                <div class="blank"></div>
            </div>
        </div>
    </main>

    <footer id="info">
        <div class="footer-container section">
            <div>
                <h2 class="title">Information</h2>
                <table>
                    <tr>
                        <th>住所</th>
                        <td>栃木市大平町富田1234<br>
                            <small>新大平下駅から徒歩1分<br>
                                栃木駅から車で15分</small>
                        </td>
                    </tr>
                    <tr>
                        <th>営業時間</th>
                        <td>9：00～17：00</td>
                    </tr>
                    <tr>
                        <th>定休日</th>
                        <td>水曜日</td>
                    </tr>
                    <tr>
                        <th>電話番号</th>
                        <td>0123-456-789</td>
                    </tr>
                    <tr>
                        <th>駐車場</th>
                        <td>有（20台）/ 店舗東側</td>
                    </tr>
                    <tr>
                        <th>支払方法</th>
                        <td>現金 / クレジットカード</td>
                    </tr>
                </table>
            </div>
            <div class="map">

                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3213.9387085711205!2d139.69931707581725!3d36.33803527238252!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601f479298c24949%3A0x33244485912e704e!2z44OX44Op44OD44OE44GK44GK44Gy44KJ!5e0!3m2!1sja!2sjp!4v1790302516253!5m2!1sja!2sjp"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>

        <div class="line thick">
            <div class="line thin">
                <div class="blank">
                    <p>&copy;2026　Oh!Ratom -English muffins &amp; Tea-</p>
                </div>
            </div>
        </div>
    </footer>
